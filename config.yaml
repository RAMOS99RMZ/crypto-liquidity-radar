# ============================================================
#  config.yaml — كل إعدادات رادار شلال السيولة في ملف واحد
#  حافظ على المسافات (Indentation) كما هي عند التعديل.
#  للتحقق بعد أي تعديل:  python radar.py selftest
# ============================================================

data_source: auto               # auto = CoinGecko إن وُجد مفتاح، وإلا CoinPaprika المجاني (بلا مفتاح)  | coingecko | paprika

paprika:                        # المصدر المجاني: 20,000 طلب/شهر (نستهلك ~4,500)
  monthly_budget: 17000

rotation:                       # توقع انتقال السيولة داخل القطاع وبين القطاعات
  enabled: true
  min_source_heat: 4.0          # أدنى حرارة للقطاع المصدر
  min_conf: 0.25                # أدنى ثقة لإرسال توقع
  window_low: 0.5               # نافذة الانتقال المعتادة = lag × [0.5 , 2]
  window_high: 2.0
  max_alerts_per_run: 2
  cooldown_hours: 8
  max_coins: 4
  prior_lag_h: 12               # تأخر افتراضي عام عند غياب المعرفة التاريخية
  prior_corr: 0.2
  prior_pairs:                  # ترتيب افتراضي عام (يُستبدل تلقائياً بنتائج backtest)
    - [l1, l2]
    - [l1, defi]
    - [l2, defi]
    - [defi, ai]
    - [rwa, defi]
    - [ai, agents]
    - [ai, depin]
    - [ai, aimeme]
    - [defi, gaming]
    - [gaming, metaverse]
    - [gaming, nft]
    - [l1, meme]
    - [meme, dogs]
    - [meme, cats]
    - [oracle, defi]

run:
  time_budget_sec: 420          # سقف زمن التشغيلة؛ بعده يتوقف الجلب الثقيل ويُحفظ كل شيء (المهلة الصارمة 9 دقائق)
  notify_errors: true           # رسالة تيليجرام عند حدوث أخطاء داخلية (مرة كل 6 ساعات)
  timezone: "Europe/Istanbul"   # توقيت العرض داخل رسائل تيليجرام
  min_score: 58                 # الحد الأدنى لقوة الإشارة (0-100). يتكيّف تلقائياً مع نتائج التعلّم
  max_alerts_per_run: 3         # أقصى عدد تنبيهات شراء في التشغيلة الواحدة
  cooldown_hours: 12            # لا يُعاد تنبيه نفس العملة قبل مرور هذه المدة
  heartbeat_hours: 24           # رسالة "الرادار يعمل" كل N ساعة (0 = تعطيل)
  notify_outcomes: true         # إرسال نتيجة كل صفقة عند إغلاقها
  dex_confirm_top: 8            # عدد المرشحين الذين يُفحصون على DEX/On-Chain في كل تشغيلة

universe:
  min_market_cap: 15000000      # أقل قيمة سوقية (USD)
  max_market_cap: 4000000000    # أعلى قيمة سوقية للمرشحين
  min_volume_24h: 1500000       # أقل حجم تداول 24 ساعة
  per_page: 60                  # عدد العملات المسحوبة لكل قطاع

gates:                          # بوابات "قبل الانفجار": نستبعد ما انفجر فعلاً
  max_coin_24h: 12.0            # % أقصى صعود 24س مسموح للعملة المرشحة
  max_coin_1h: 5.0              # % أقصى صعود 1س

live:                           # الطبقة اللحظية: أسعار البورصات العامة (بلا مفتاح وبلا سقف شهري)
  enabled: true
  klines_per_run: 45            # شموع تُجلب في كل تشغيلة لبناء الارتباط (الوضع المجاني)، القطاعات الأسخن أولاً
  exchanges: [binance_vision, mexc, gate, kucoin]   # ترتيب المحاولة (Binance.com محجوبة من خوادم GitHub)
  match_tolerance: 0.12         # أقصى فرق سعر بين CoinGecko والبورصة لقبول تطابق الرمز
  snapshot_hours: 3             # مدة حفظ لقطات الأسعار لحساب تغير الساعة

sector:                         # مصفوفة تدوير القطاعات
  hot_heat: 4.0                 # % حرارة القطاع لاعتباره "ساخناً" (يُستبدل بالقيمة المضبوطة من الاختبار الرجعي)
  min_breadth: 0.55             # نسبة العملات الصاعدة داخل القطاع
  laggard_gap: 4.0              # % الفجوة بين القطاع والعملة المتأخرة
  laggard_max_24h: 6.0          # % أقصى أداء 24س للعملة "المتأخرة"
  min_corr: 0.40                # أدنى معامل ارتباط مع القطاع
  max_7d_dump: -40.0            # % نستبعد العملات المنهارة أسبوعياً

waterfall:                      # شلال السيولة البيئي
  native_24h: 5.0               # % صعود العملة الأم خلال 24س لتفعيل الفحص
  native_1h: 2.0                # % صعود العملة الأم خلال ساعة
  max_triggers: 3               # أقصى عدد شبكات تُفحص لكل تشغيلة
  min_corr: 0.30
  laggard_gap: 3.0

attention:                      # زخم الانتباه
  alpha: 0.02                   # سرعة تعلّم خط الأساس (EWMA)
  warmup_runs: 12               # عدد التشغيلات قبل اعتبار خط الأساس جاهزاً (~ساعتان)
  trending_penalty: 8           # خصم نقاط إذا كانت العملة Trending أصلاً (الجمهور سبقنا)

bridge:                         # تدفق السيولة للشبكات (مستقرات)
  min_stable_inflow_usd_6h: 30000000
  min_stable_inflow_pct_6h: 0.5
  history_hours: 48

targets:                        # الأهداف الواقعية (مقاومات + جدران بيع + سيولة + تاريخ)
  min_t1_pct: 3.0               # أقل مسافة للهدف الأول
  max_target_pct: 120.0         # أقصى هدف ممكن (الصعود قد يتجاوز 100% عند سيولة ضخمة ودفتر رقيق)
  wall_min_usd: 40000           # أقل قيمة لتجمّع أوامر بيع/شراء يُعتبر جداراً
  wall_vs_volume: 0.02          # أو نسبة من حجم 24س (الأكبر منهما)
  wall_band_pct: 0.6            # عرض نطاق تجميع الأوامر %
  depth_limit: 100              # عدد مستويات دفتر الأوامر
  orderbook_top: 4              # أقصى عدد دفاتر أوامر تُفحص في كل تشغيلة
  flow_share: 0.25              # حصة من حجم 24س تُعتبر تدفق شراء صافياً مقدّراً
  stop_atr_mult: 1.2            # مضاعف التذبذب للوقف عند غياب دعم هيكلي

risk:                           # حدود الوقف وإدارة الصفقة
  default_daily_vol: 6.0
  stop_min: 4.0
  stop_max: 12.0
  rr: 1.8                       # يُستخدم في الاختبار الرجعي
  horizon_hours: 36             # مهلة الصفقة التي لم تبلغ T1

positions:                      # إدارة الصفقات المفتوحة
  trail_after_t1: true          # نقل الوقف لنقطة الدخول بعد T1 وإلى T1 بعد T2
  max_hold_hours: 72            # أقصى مدة للصفقة الرابحة
  momentum_break_pct: 3.5       # تراجع % عن قمة الصفقة يُطلق تحذير ضعف الزخم

distribution:                   # كشف التصريف
  enabled: true
  warn_cooldown_hours: 6
  max_warnings_per_run: 3
  exchange_inflow_usd: 150000   # إيداع حوت في منصة بهذه القيمة = تحذير
  climax_24h: 15.0              # % صعود 24س يُعتبر ذروة
  climax_pullback_1h: -1.5      # % انعكاس ساعة بعد الذروة
  climax_vol_ratio: 2.0         # ضعف حجم التداول المعتاد

whales:                         # تتبع الحيتان (EVM عبر Etherscan/Blockscout + Solana)
  min_usd: 100000               # أقل قيمة حركة لتعتبر "حوتاً"
  min_liquidity: 250000         # أقل سيولة للعملة (فلتر ضد عملات السبام)
  first_run_lookback_min: 60
  max_wallets: 40
  sell_block_usd: 250000        # إذا أودع الحيتان هذه القيمة في منصة → نمنع التنبيه
  token_flow_check: true        # فحص Inflow/Outflow المنصات على عقد العملة نفسها

  # ---------- عناوين المنصات (كلها موسومة على Etherscan Labels) ----------
  exchanges:
    "Binance 14":          "0x28c6c06298d514db089934071355e5743bf21d60"
    "Binance Hot Wallet":  "0xdfd5293d8e347dfe59e90efd55b2956a1343963d"
    "Coinbase 10":         "0xa9d1e08c7793af67e9d92fe308d5697fb81d3e43"
    "Bybit Hot Wallet":    "0xf89d7b9c864f589bbf53a82105107622b35eaa40"

  # ---------- محافظ الحيتان / صناع السوق / الصناديق ----------
  # weight = وزن الثقة (0-1). شبكات الدعم المجاني: ethereum, arbitrum, polygon (Etherscan/Blockscout)،
  # base, optimism (Blockscout)، solana (RPC). شبكة bsc غير مدعومة مجاناً حالياً.
  # يُضاف إليها تلقائياً "المحافظ المكتشفة" (قسم discovery) بعد تكرارها مع صفقات رابحة.
  wallets:
    - {label: "DWF Labs (مشتريات معلنة)", chain: ethereum, address: "0xF0984860f1F31a784c0FF0bb4d1322e377f97631", weight: 1.0}
    - {label: "DWF Labs (مشتريات معلنة)", chain: base,     address: "0xF0984860f1F31a784c0FF0bb4d1322e377f97631", weight: 1.0}
    - {label: "DWF Labs (مشتريات معلنة)", chain: solana,   address: "HwDkuDCUipJHHKodBBCjffFvrjhmd4iVVh7fq25fShvt", weight: 1.0}
    - {label: "DWF Labs", chain: ethereum, address: "0xD4B69e8D62C880E9DD55d419d5E07435C3538342", weight: 0.7}
    - {label: "DWF Labs", chain: ethereum, address: "0xddAcAd3B1edee8E2F5b2e84f658202534fcb0374", weight: 0.7}
    - {label: "a16z",                   chain: ethereum, address: "0x05E793cE0C6027323Ac150F6d45C2344d28B6019", weight: 0.9}
    - {label: "a16z (منسوب، غير مؤكد)", chain: ethereum, address: "0xb5E4d21240e9356caFc3a1261d10383f62DFc24e", weight: 0.7}
    - {label: "Wintermute",   chain: ethereum, address: "0xDBF5E9c5206d0dB70a90108bf936DA60221dC080", weight: 0.5}
    - {label: "Wintermute 2", chain: ethereum, address: "0x000002Cba8DfB0a86A47a415592835E17fac080a", weight: 0.4}
    - {label: "Jump Trading", chain: ethereum, address: "0xf584F8728B874a6a5c7A8d4d387C9aae9172D621", weight: 0.6}

discovery:                      # اكتشاف المحافظ الذكية تلقائياً من أوائل مشتري العملات الرابحة (إيثريوم + مفتاح Etherscan)
  enabled: true
  min_usd: 50000                # أقل صافي شراء مبكر
  min_hits: 2                   # عدد العملات الرابحة التي تكرر فيها العنوان ليُضاف للمراقبة
  max_wallets: 12
  weight: 0.6

context:                        # سياق: أخبار RSS + تغيّر TVL + مراجعة ذكية اختيارية
  news_hours: 24
  llm:
    enabled: auto               # auto = يعمل فقط إذا وُجد ANTHROPIC_API_KEY (مدفوع الاستخدام)
    model: claude-haiku-4-5-20251001
    max_calls_per_run: 2        # فقط للإشارات التي تجاوزت الحد الأدنى

dex:                            # تأكيد DexScreener
  min_liquidity: 150000
  identity_low: 0.35            # فلتر هوية العملة: نسبة قيمة DEX السوقية إلى CoinGecko
  identity_high: 3.0
  min_txns_h1: 20

learning:                       # التعلّم الذاتي
  min_samples: 30
  max_alpha: 0.7
  alpha_k: 60
  lr: 0.05
  l2: 0.01
  win_window: 30

backtest:                       # الاختبار الرجعي (python radar.py backtest) ويعمل أسبوعياً من Actions
  candles: 1000                 # عدد شموع الساعة لكل عملة
  pages: 2                      # صفحات (Binance/MEXC فقط) لزيادة العمق
  top_per_group: 25
  horizon_hours: 36
  min_trades: 30
  apply_tuned: true             # تطبيق العتبات المضبوطة تلقائياً إن أثبت الاختبار ميزة إحصائية

coingecko:                      # ميزانية الطلبات (الخطة المجانية Demo = 10,000 طلب/شهر فقط!)
  monthly_budget: 8500          # هامش أمان تحت 10,000. الرادار يوزّعها تلقائياً ويعمل على الكاش عند النفاد
  refresh_minutes_live: 720     # مع الطبقة اللحظية: بنية القطاعات تتجدد كل 12 ساعة (الأسعار لحظية من البورصة)
  refresh_minutes_nolive: 90    # بدون بورصات: تجديد كل 90 دقيقة قدر الميزانية
  max_cache_age_hours_live: 48
  max_cache_age_hours_nolive: 12
  trending_refresh_minutes: 60
  retry_after_fail_minutes: 15  # بعد فشل/429 لا نعيد المحاولة قبل هذه المدة

network:
  coingecko_interval_free: 4.5  # ثواني بين الطلبات بدون مفتاح
  coingecko_interval_key: 2.2   # ثواني بين الطلبات مع مفتاح Demo

# ---------------- القطاعات (سلات) ----------------
# category = معرّف CoinGecko (يُستخدم عند وجود مفتاح CoinGecko)
# tags     = كلمات تطابق أسماء وسوم CoinPaprika (الوضع المجاني بلا مفتاح)
# llama    = فئات DefiLlama (تضيف بروتوكولات القطاع تلقائياً من TVL)
# شغّل  python radar.py check  لترى الوسوم المطابقة لكل قطاع وعدد عملاته، وعدّل الكلمات إن لزم.
sectors:
  l1: {label: "Layer 1 · الشبكات الأساسية", category: layer-1, tags: ["layer 1", "layer-1", "smart contracts", "blockchain service"]}
  l2: {label: "Layer 2 · الطبقة الثانية", category: layer-2, tags: ["layer 2", "layer-2", "scaling", "rollup"]}
  l0: {label: "Layer 0 · ربط الشبكات", category: layer-0-l0, tags: ["layer 0", "layer-0", "interoperability"]}
  modular: {label: "Modular · الشبكات المعيارية", category: modular-blockchain, tags: ["modular", "data availability"]}
  zk: {label: "ZK · المعرفة الصفرية", category: zero-knowledge-zk, tags: ["zero knowledge", "zk"]}
  smart: {label: "Smart Contract Platforms", category: smart-contract-platform, tags: ["smart contracts"]}
  infra: {label: "Infrastructure · البنية", category: infrastructure, tags: ["infrastructure", "blockchain service"]}
  interop: {label: "Interoperability · الجسور", category: cross-chain-communication, tags: ["interoperability", "cross chain", "bridge"], llama: ["Bridge", "Cross Chain Bridge"]}
  oracle: {label: "Oracle · الأوراكل", category: oracle, tags: ["oracle"], llama: ["Oracle"]}
  storage: {label: "Storage · التخزين", category: storage, tags: ["storage"]}
  depin: {label: "DePIN · البنية اللامركزية", category: depin, tags: ["depin", "decentralized physical"]}
  iot: {label: "IoT · إنترنت الأشياء", category: internet-of-things-iot, tags: ["iot", "internet of things"]}
  defi: {label: "DeFi · التمويل اللامركزي", category: decentralized-finance-defi, tags: ["defi", "decentralized finance"], llama: ["Dexs", "Lending", "Yield", "Yield Aggregator", "Liquid Staking", "Derivatives", "Options", "CDP"]}
  dex: {label: "DEX · البورصات اللامركزية", category: decentralized-exchange, tags: ["dex", "decentralized exchange", "amm"], llama: ["Dexs"]}
  lending: {label: "Lending · الإقراض", category: lending-borrowing, tags: ["lending"], llama: ["Lending", "CDP"]}
  yield: {label: "Yield · العوائد", category: yield-aggregator, tags: ["yield"], llama: ["Yield", "Yield Aggregator", "Leveraged Farming"]}
  derivatives: {label: "Derivatives · المشتقات", category: derivatives, tags: ["derivative"], llama: ["Derivatives", "Options"]}
  perps: {label: "Perps · العقود الدائمة", category: perpetuals, tags: ["perp"], llama: ["Derivatives"]}
  lst: {label: "Liquid Staking · التخزين السائل", category: liquid-staking-governance-tokens, tags: ["staking"], llama: ["Liquid Staking"]}
  restaking: {label: "Restaking · إعادة الرهن", category: restaking, tags: ["restaking"], llama: ["Restaking", "Liquid Restaking"]}
  rwa: {label: "RWA · الأصول الحقيقية", category: real-world-assets-rwa, tags: ["rwa", "real world", "tokenized"], llama: ["RWA", "RWA Lending"]}
  tokenstocks: {label: "Tokenized Stocks · الأسهم المرمّزة", category: tokenized-stocks, tags: ["stock"]}
  ai: {label: "AI · الذكاء الاصطناعي", category: artificial-intelligence, tags: ["ai", "artificial intelligence", "big data"]}
  agents: {label: "AI Agents · وكلاء الذكاء", category: ai-agents, tags: ["agent"]}
  aiapps: {label: "AI Apps · تطبيقات الذكاء", category: ai-applications, tags: ["ai application"]}
  meme: {label: "Meme · الميم", category: meme-token, tags: ["meme"]}
  dogs: {label: "Dog Memes · ميم الكلاب", category: dog-themed-coins, tags: ["dog", "doge"]}
  cats: {label: "Cat Memes · ميم القطط", category: cat-themed-coins, tags: ["cat"]}
  aimeme: {label: "AI Memes", category: ai-meme-coins, tags: ["ai meme"]}
  gaming: {label: "Gaming · الألعاب", category: gaming, tags: ["gaming", "gamefi", "game"]}
  p2e: {label: "Play-to-Earn", category: play-to-earn, tags: ["play to earn"]}
  metaverse: {label: "Metaverse · الميتافيرس", category: metaverse, tags: ["metaverse"]}
  nft: {label: "NFT", category: non-fungible-tokens-nft, tags: ["nft"]}
  socialfi: {label: "SocialFi · الاجتماعية", category: socialfi, tags: ["social"]}
  privacy: {label: "Privacy · الخصوصية", category: privacy-coins, tags: ["privacy"]}
  prediction: {label: "Prediction Markets · التنبؤات", category: prediction-markets, tags: ["prediction"]}
  btcfi: {label: "Bitcoin Ecosystem · نظام بيتكوين", category: bitcoin-ecosystem, tags: ["bitcoin ecosystem", "brc", "ordinals", "runes"]}
  brc20: {label: "BRC-20", category: brc-20, tags: ["brc"]}
  cex: {label: "Exchange Tokens · عملات المنصات", category: exchange-based-tokens, tags: ["exchange token"]}
  launchpad: {label: "Launchpad · منصات الإطلاق", category: launchpad, tags: ["launchpad"]}
  fan: {label: "Fan Tokens · عملات المشجعين", category: fan-token, tags: ["fan token"]}
  identity: {label: "Identity · الهوية", category: identity, tags: ["identity"]}
  analytics: {label: "Analytics · التحليلات", category: analytics, tags: ["analytic", "data"]}
  payments: {label: "Payments · المدفوعات", category: payment-solutions, tags: ["payment"]}
  gambling: {label: "Gambling · المراهنات", category: gambling, tags: ["gambling", "casino"]}
  realestate: {label: "Real Estate · العقارات", category: real-estate, tags: ["real estate"]}
  energy: {label: "Energy · الطاقة", category: energy, tags: ["energy"]}

# native/symbol = العملة الأم (CoinGecko id / رمز للوضع المجاني)،  chain = اسم الشبكة في DefiLlama
# tags = كلمات وسوم CoinPaprika، وعضوية النظام تُستكمل من بروتوكولات DefiLlama التي تعمل على الشبكة
ecosystems:
  solana: {label: "Solana", native: solana, symbol: SOL, category: solana-ecosystem, chain: "Solana", tags: ["solana"]}
  sui: {label: "Sui", native: sui, symbol: SUI, category: sui-ecosystem, chain: "Sui", tags: ["sui"]}
  ethereum: {label: "Ethereum", native: ethereum, symbol: ETH, category: ethereum-ecosystem, chain: "Ethereum", tags: ["ethereum"]}
  base: {label: "Base", native: null, symbol: null, category: base-ecosystem, chain: "Base", tags: ["base"]}
  arbitrum: {label: "Arbitrum", native: arbitrum, symbol: ARB, category: arbitrum-ecosystem, chain: "Arbitrum", tags: ["arbitrum"]}
  optimism: {label: "Optimism", native: optimism, symbol: OP, category: optimism-ecosystem, chain: "OP Mainnet", tags: ["optimism"]}
  avalanche: {label: "Avalanche", native: avalanche-2, symbol: AVAX, category: avalanche-ecosystem, chain: "Avalanche", tags: ["avalanche"]}
  bnb: {label: "BNB Chain", native: binancecoin, symbol: BNB, category: binance-smart-chain, chain: "BSC", tags: ["bnb", "binance smart"]}
  near: {label: "NEAR", native: near, symbol: NEAR, category: near-protocol-ecosystem, chain: "Near", tags: ["near protocol"]}
  aptos: {label: "Aptos", native: aptos, symbol: APT, category: aptos-ecosystem, chain: "Aptos", tags: ["aptos"]}
  ton: {label: "TON", native: the-open-network, symbol: TON, category: ton-ecosystem, chain: "TON", tags: ["ton"]}
