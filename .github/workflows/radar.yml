name: Liquidity Radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تشغيل تجريبي (بدون تيليجرام)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PLAN: ${{ secrets.COINGECKO_PLAN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python radar.py run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}

      - name: Prune old state caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key radar-state- --sort created_at --order desc --limit 100 --json id --jq '.[8:] | .[].id' \
            | xargs -r -n1 gh cache delete
