name: Liquidity Radar

on:
  schedule:
    - cron: "*/10 * * * *"      # كل 10 دقائق (GitHub قد يؤخر التنفيذ بضع دقائق أحياناً)
  workflow_dispatch:
    inputs:
      mode:
        description: "نمط التشغيل اليدوي"
        type: choice
        default: dry_run
        options:
          - dry_run          # تشغيلة تجريبية بدون تيليجرام
          - run              # تشغيلة حقيقية
          - selftest         # التحقق الذاتي من الكود + فحص المزوّدين
          - test_telegram    # رسائل اختبار بشكل التنبيهات

permissions:
  contents: read
  actions: write

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PLAN: ${{ secrets.COINGECKO_PLAN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Self-test
        if: ${{ inputs.mode == 'selftest' }}
        run: python radar.py selftest

      - name: Test Telegram
        if: ${{ inputs.mode == 'test_telegram' }}
        run: python radar.py test-telegram

      - name: Run radar
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == 'dry_run' }}
        run: python radar.py run ${{ inputs.mode == 'dry_run' && '--dry-run' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}

      - name: Prune old state caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key radar-state- --sort created_at --order desc --limit 100 --json id --jq '.[8:] | .[].id' \
            | xargs -r -n1 gh cache delete
