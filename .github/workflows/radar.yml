name: Liquidity Radar

on:
  schedule:
    - cron: "*/10 * * * *"      # كل 10 دقائق (GitHub قد يؤخر التنفيذ بضع دقائق أحياناً)
  workflow_dispatch:
    inputs:
      mode:
        description: "نمط التشغيل اليدوي (الجدولة تعمل دائماً بنمط run الحقيقي)"
        type: choice
        default: doctor
        options:
          - doctor           # الفحص الشامل: الأسرار + المفاتيح + المزوّدون + الكود + تشغيلة تجريبية + تقرير تيليجرام (ابدأ بهذا)
          - run              # تشغيلة حقيقية (ترسل لتيليجرام وتحفظ الحالة)
          - dry_run          # تجريبية: لا ترسل ولا تحفظ شيئاً
          - selftest         # التحقق الذاتي من الكود + فحص المزوّدين
          - test_telegram    # رسائل اختبار بشكل التنبيهات

permissions:
  contents: read
  actions: write

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # الاسم الأول هو المعتمد؛ البدائل تلتقط الخطأ الشائع (إضافة السر كـ Variable أو بأسماء مشابهة)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY || vars.COINGECKO_API_KEY }}
      COINGECKO_PLAN: ${{ secrets.COINGECKO_PLAN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY || vars.ETHERSCAN_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || vars.SOLANA_RPC_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY || vars.HELIUS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE || vars.RPC_URL_BASE }}     # اختياري: عقدة Base خاصة مجانية (Alchemy/dRPC)
      RPC_URL_BSC: ${{ secrets.RPC_URL_BSC || vars.RPC_URL_BSC }}
      GH_TOKEN: ${{ github.token }}   # نشاط المطورين من GitHub (تلقائي، لا تضفه كسر)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Doctor (الفحص الشامل)
        if: ${{ inputs.mode == 'doctor' }}
        run: python radar.py doctor

      - name: Self-test
        if: ${{ inputs.mode == 'selftest' }}
        run: python radar.py selftest

      - name: Test Telegram
        if: ${{ inputs.mode == 'test_telegram' }}
        run: python radar.py test-telegram

      - name: Run radar
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == 'dry_run' }}
        run: python radar.py run ${{ inputs.mode == 'dry_run' && '--dry-run' || '' }}

      - name: Save state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'run') }}
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}

      - name: Prune old state caches
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'run') }}
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key radar-state- --sort created_at --order desc --limit 100 --json id --jq '.[8:] | .[].id' \
            | xargs -r -n1 gh cache delete
